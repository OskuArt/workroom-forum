services:
  - type: web
    name: workroom-forum
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node -r ./brevo-fetch-shim.js -r ./vacancy-monitor-v3.js -r ./hh-bulk-import.js -r ./vacancy-quality.js -r ./job-maintenance.js -r ./ban-system.js -r ./social-features.js -r ./presence-system.js -r ./jobs-catalogue.js server.js
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: workroom-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SITE_NAME
        value: WORK//ROOM
      - key: ADMIN_EMAIL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false

      # Old Jobicy/Arbeitnow path is disabled. v3 + bulk HH are the vacancy acquisition pipeline.
      - key: ENABLE_JOB_IMPORT
        value: false
      - key: VACANCY_MONITOR_ENABLED
        value: true
      # Three-month ceiling. Catalogue and quality gate enforce the same rule.
      - key: VACANCY_MAX_AGE_DAYS
        value: 90
      - key: JOBS_PER_PAGE
        value: 120

      # hh.ru multilingual role monitoring + broad depth pool.
      - key: HH_PERIOD_DAYS
        value: 3
      - key: HH_QUERY_LIMIT
        value: 80
      - key: HH_DETAIL_LIMIT
        value: 360
      - key: HH_BULK_TARGET
        value: 1400
      - key: HH_BULK_PAGES
        value: 2

      # Telegram: digest posts are opened link-by-link; primary job pages become the stored source.
      - key: TELEGRAM_JOB_CHANNELS
        value: "mirkreatorovjob,designhunters,jun_hi_vacancies,serbia_vacancies,rabotavserbii,desivr_design"

      # Instagram: partner accounts + rotating multilingual vacancy hashtags.
      - key: INSTAGRAM_JOB_ACCOUNTS
        value: "vacancy_design,simple_studio,beginit.indrive.ca"
      - key: INSTAGRAM_HASHTAG_BUDGET
        value: 4
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_IG_USER_ID
        sync: false

databases:
  - name: workroom-db
    plan: free
    databaseName: workroom
    user: workroom
