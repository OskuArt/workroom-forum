services:
  - type: web
    name: constellation-dating
    runtime: node
    branch: constellation-dating
    buildCommand: rm -rf .constellation_app && mkdir .constellation_app && tar -xzf constellation-bundle.tar.gz -C .constellation_app && cd .constellation_app && npm install
    startCommand: cd .constellation_app && npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: constellation-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: AUTH_PEPPER
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: ALLOW_DEMO_AUTH
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: CONSTELLATION

databases:
  - name: constellation-db
