services:
  - type: web
    name: constellation-dating
    runtime: node
    plan: free
    branch: constellation-dating
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: constellation-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: AUTH_PEPPER
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: ALLOW_DEMO_AUTH
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: CONSTELLATION

databases:
  - name: constellation-db
    plan: free
    postgresMajorVersion: "18"
