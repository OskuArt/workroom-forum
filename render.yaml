services:
  - type: web
    name: workroom-forum
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node -r ./brevo-fetch-shim.js -r ./vacancy-monitor-v3.js -r ./job-maintenance.js -r ./ban-system.js -r ./social-features.js server.js
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: workroom-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SITE_NAME
        value: WORK//ROOM
      - key: ADMIN_EMAIL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false

      # Old Jobicy/Arbeitnow path is disabled. v3 is the only vacancy acquisition pipeline.
      - key: ENABLE_JOB_IMPORT
        value: false
      - key: VACANCY_MONITOR_ENABLED
        value: true
      - key: VACANCY_MAX_AGE_DAYS
        value: 21

      # hh.ru: multilingual role/vacancy monitoring. No API key is required for public vacancy search.
      - key: HH_PERIOD_DAYS
        value: 3
      - key: HH_QUERY_LIMIT
        value: 60
      - key: HH_DETAIL_LIMIT
        value: 260

      # Telegram: digest posts are opened link-by-link; primary job pages become the stored source.
      - key: TELEGRAM_JOB_CHANNELS
        value: "mirkreatorovjob,designhunters,jun_hi_vacancies,serbia_vacancies,rabotavserbii,desivr_design"

      # Instagram: partner accounts + rotating multilingual vacancy hashtags.
      - key: INSTAGRAM_JOB_ACCOUNTS
        value: "vacancy_design,simple_studio,beginit.indrive.ca"
      - key: INSTAGRAM_HASHTAG_BUDGET
        value: 4
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_IG_USER_ID
        sync: false

databases:
  - name: workroom-db
    plan: free
    databaseName: workroom
    user: workroom
