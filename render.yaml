services:
  - type: web
    name: workroom-forum
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node -r ./brevo-fetch-shim.js -r ./partner-job-imports.js -r ./job-maintenance.js server.js
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: workroom-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SITE_NAME
        value: WORK//ROOM
      - key: ADMIN_EMAIL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: ENABLE_JOB_IMPORT
        value: true
      - key: JOB_IMPORT_INTERVAL_HOURS
        value: 24
      - key: JOB_MAX_AGE_DAYS
        value: 45
      - key: ARBEITNOW_IMPORT_PAGES
        value: 4
      - key: HH_PERIOD_DAYS
        value: 3
      - key: HH_JOB_SEARCH_TERMS
        value: "графический дизайнер,UI UX дизайнер,product designer,motion designer,иллюстратор,frontend developer,backend developer,fullstack developer,software engineer,product manager,маркетолог,performance marketing,gamedev,igaming,data analyst,AI engineer"
      - key: INSTAGRAM_JOB_ACCOUNTS
        value: "vacancy_design,simple_studio,beginit.indrive.ca"
      - key: INSTAGRAM_VACANCY_PROFESSIONS
        value: "graphic designer,ui designer,ux designer,product designer,motion designer,illustrator,frontend developer,backend developer,software engineer,product manager,marketing manager,performance marketer,game developer,igaming,data analyst,ai engineer,ai creator"
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_IG_USER_ID
        sync: false

databases:
  - name: workroom-db
    plan: free
    databaseName: workroom
    user: workroom
